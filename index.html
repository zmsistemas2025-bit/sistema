<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZM CRM</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
    }

    header{
      background:#1e293b;
      padding:20px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
      color:#3b82f6;
    }

    .container{
      padding:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:20px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:12px;
    }

    .title{
      font-size:18px;
      margin-bottom:10px;
    }

    .value{
      font-size:32px;
      color:#22c55e;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>
  ZM CRM
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <div class="title">Meta Diária</div>
      <div class="value">R$ 0,00</div>
    </div>

    <div class="card">
      <div class="title">Meta Semanal</div>
      <div class="value">R$ 0,00</div>
    </div>

    <div class="card">
      <div class="title">Meta Mensal</div>
      <div class="value">R$ 0,00</div>
    </div>

    <div class="card">
      <div class="title">120% da Meta</div>
      <div class="value">0%</div>
    </div>

  </div>

</div>

</body>
</html>
